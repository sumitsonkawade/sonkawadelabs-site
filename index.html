<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSC Pro</title>
  <meta name="description" content="Automates Maharashtra government certificate applications for CSC operators - Income, Domicile, Caste, NCL, EWS and SEBC in minutes.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --panel: rgba(24, 24, 27, 0.86);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #22c55e;
      --accent-2: #15803d;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top, rgba(34, 197, 94, 0.18), transparent 38%),
        radial-gradient(circle at bottom right, rgba(21, 128, 61, 0.16), transparent 30%),
        linear-gradient(180deg, #0b0b0d 0%, #09090b 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(100%, 760px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      padding: 48px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.18), transparent 30%, transparent 70%, rgba(34, 197, 94, 0.14));
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 14px;
      font-size: clamp(42px, 9vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 auto;
      max-width: 620px;
      font-size: clamp(16px, 2.6vw, 20px);
      line-height: 1.7;
      color: var(--muted);
    }

    .actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 16px 26px;
      min-width: 190px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      color: #04110a;
      background: linear-gradient(135deg, var(--accent), #86efac);
      box-shadow: 0 18px 36px rgba(34, 197, 94, 0.24);
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 22px 44px rgba(34, 197, 94, 0.3);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.9;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(4, 17, 10, 0.22);
      border-top-color: #04110a;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    .button-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: #fca5a5;
    }

    .legal-links {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .legal-links a {
      color: #bbf7d0;
      text-decoration: none;
      font-size: 14px;
    }

    .legal-links a:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 36px 22px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="badge">Railway Hosted</div>
    <h1>CSC Pro</h1>
    <p>Automates Maharashtra government certificate applications for CSC operators — Income, Domicile, Caste, NCL, EWS &amp; SEBC in minutes.</p>
    <div class="actions">
      <button id="downloadBtn" type="button" aria-live="polite">
        <span class="button-row">
          <span id="buttonLabel">Download</span>
        </span>
      </button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="legal-links">
      <a href="/privacy">Privacy Policy</a>
    </div>
  </main>

  <script>
    const downloadBtn = document.getElementById("downloadBtn");
    const buttonLabel = document.getElementById("buttonLabel");
    const statusEl = document.getElementById("status");

    function setLoading(isLoading) {
      downloadBtn.disabled = isLoading;
      buttonLabel.textContent = "";

      const row = document.createElement("span");
      row.className = "button-row";

      if (isLoading) {
        const spinner = document.createElement("span");
        spinner.className = "spinner";
        spinner.setAttribute("aria-hidden", "true");
        row.appendChild(spinner);
        row.appendChild(document.createTextNode("Preparing download"));
      } else {
        row.appendChild(document.createTextNode("Download"));
      }

      downloadBtn.replaceChildren(row);
    }

    function setStatus(message, isError) {
      statusEl.textContent = message || "";
      statusEl.className = isError ? "status error" : "status";
    }

    const RELEASE_DOWNLOAD_URL = "https://github.com/sumitsonkawade/sonkawadelabs-site/releases/latest/download/CSC_Pro_Setup.zip";

    function triggerDownload(url, fileName) {
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = fileName || "CSC_Pro_Setup.zip";
      anchor.rel = "noopener";
      anchor.style.display = "none";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    async function downloadLatestExe() {
      setStatus("", false);
      setLoading(true);

      try {
        triggerDownload(RELEASE_DOWNLOAD_URL, "CSC_Pro_Setup.zip");
        setStatus("Download started.", false);
      } catch (error) {
        console.error(error);
        setStatus(error instanceof Error ? error.message : "Download failed.", true);
      } finally {
        setLoading(false);
      }
    }

    downloadBtn.addEventListener("click", downloadLatestExe);
    setLoading(false);
  </script>
</body>
</html>
